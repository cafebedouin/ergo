name: diag-forkres9
# ForkResolutionSpec, five independent runs, each uploading every node's container log (target/logs, written by the it
# framework's Docker.close) and the sbt output. Runs on pushes to diag/forkres9-* only.
on:
  push:
    branches: [ 'diag/forkres9-*' ]
jobs:
  forkres:
    strategy:
      fail-fast: false
      matrix:
        run: [ 1, 2, 3, 4, 5 ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v1
        with:
          jvm: temurin:8
          apps: sbt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}
      - name: ForkResolutionSpec
        timeout-minutes: 45
        run: |
          mkdir -p tmp
          set -o pipefail
          TMPDIR=$(pwd)/tmp sbt -Denv=test ++2.12.20 docker "it:testOnly org.ergoplatform.it.ForkResolutionSpec" 2>&1 | tee sbt-output.log
      - name: Upload node logs and sbt output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-run-${{ matrix.run }}
          path: |
            target/logs/
            sbt-output.log
          if-no-files-found: warn
          retention-days: 14
